version: "3"

vars:
  USERNAME:
    sh: whoami
  HOME_DIR: /Users/{{.USERNAME}}
  HOSTNAME:
    sh: "(scutil --get ComputerName 2>/dev/null || uname -n) | tr -cd 'A-Za-z0-9-' | tr ' ' '-'"
  ML_PATH: /Users/{{.USERNAME}}/.config/mailerlite/nix-config
  ML_OVERRIDE:
    sh: "[ -d '{{.ML_PATH}}' ] || echo '--override-input mailerlite path:./stubs/mailerlite'"

tasks:
  default:
    cmds:
      - task --list

  gc:
    cmds:
      - nix-collect-garbage
    desc: Tidy up the nix store

  build-config:
    internal: true
    silent: true
    cmds:
      - nix build .#darwinConfigurations.{{.HOSTNAME}}.system --impure --show-trace --refresh {{.ML_OVERRIDE}}

  switch-config:
    internal: true
    silent: true
    cmds:
      - |
        if command -v darwin-rebuild &> /dev/null; then
          sudo darwin-rebuild switch --flake .#{{.HOSTNAME}} --impure --show-trace --refresh {{.ML_OVERRIDE}}
        else
          sudo nix run nix-darwin -- switch --flake .#{{.HOSTNAME}} --impure --show-trace --refresh {{.ML_OVERRIDE}}
        fi

  update:
    # deps: [update-betterbird]
    cmds:
      - nix flake update
    desc: Update the flake.lock file and all pinned app versions

  # update-betterbird:
  #   internal: true
  #   cmds:
  #     - |
  #       LATEST_URL=$(curl -sI "https://www.betterbird.eu/downloads/get.php?os=mac&lang=en-US&version=release" | grep -i "^location:" | sed 's/[Ll]ocation: //' | tr -d '\r\n')
  #       VERSION=$(basename "$LATEST_URL" | sed 's/betterbird-//' | sed 's/.en-US.mac.dmg//')
  #       CURRENT=$(grep 'version = ' modules/apps/betterbird.nix | sed 's/.*version = "\(.*\)".*/\1/')
  #       if [ "$VERSION" = "$CURRENT" ]; then
  #         echo "betterbird already at $VERSION"
  #       else
  #         echo "updating betterbird $CURRENT → $VERSION"
  #         HASH=$(nix-prefetch-url --type sha256 "$LATEST_URL" 2>/dev/null)
  #         HASH_SRI=$(nix hash convert --hash-algo sha256 "$HASH")
  #         sed -i '' "s/version = \"$CURRENT\"/version = \"$VERSION\"/" modules/apps/betterbird.nix
  #         sed -i '' "s|sha256 = \".*\"|sha256 = \"$HASH_SRI\"|" modules/apps/betterbird.nix
  #       fi

  update-mailerlite:
    cmds:
      - |
        if [ -d "{{.ML_PATH}}" ]; then
          nix flake update mailerlite
        else
          echo "mailerlite path not present on this machine, skipping"
        fi
    desc: Update the mailerlite input in the flake.lock file

  update-hash:
    internal: true
    cmds:
      - ml-update-hash 2>/dev/null || true
    desc: Update the stored hash after successful build

  build:
    deps: [update-mailerlite]
    cmds:
      - task: build-config
      - task: switch-config
      - task: update-hash
    desc: Build and apply the new configuration based on the OS

  update-build:
    deps: [update, build]
    desc: Update the flake.lock file and build the new configuration
