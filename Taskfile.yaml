version: "3"

vars:
  USERNAME:
    sh: whoami
  HOME_DIR: /Users/{{.USERNAME}}
  HOSTNAME:
    sh: "(scutil --get ComputerName 2>/dev/null || uname -n) | tr -cd 'A-Za-z0-9-' | tr ' ' '-'"
  ML_PATH: /Users/{{.USERNAME}}/.config/mailerlite/nix-config
  ML_OVERRIDE:
    sh: "[ -d '{{.ML_PATH}}' ] || echo '--override-input mailerlite path:./stubs/mailerlite'"
  # nix.enable = false (see hosts/darwin.nix) makes nix-darwin's nix.settings a
  # no-op — nix.settings.substituters is never actually written to
  # /etc/nix/nix.conf, so sofka's cache has to be passed as CLI flags instead.
  # Must use `--option name value`, not `--extra-substituters`/
  # `--extra-trusted-public-keys`: darwin-rebuild's own arg parser only
  # recognizes a fixed flag whitelist (incl. --option) and rejects anything else.
  SOFKA_CACHE: >-
    --option extra-substituters https://nkl-sofka.cachix.org
    --option extra-trusted-public-keys nkl-sofka.cachix.org-1:hLg9frFNJynrxe7SSBb/p6pbawlpZmG10bw+wLsTufw=

tasks:
  default:
    cmds:
      - task --list

  gc:
    cmds:
      - nix-collect-garbage
    desc: Tidy up the nix store

  build-check:
    silent: true
    cmds:
      - nix build .#darwinConfigurations.{{.HOSTNAME}}.system --impure --show-trace --max-jobs 4 {{.SOFKA_CACHE}} {{.ML_OVERRIDE}}
    desc: "Build (but don't switch) the configuration, to sanity-check it before applying"

  switch-config:
    internal: true
    silent: true
    cmds:
      - |
        if command -v darwin-rebuild &> /dev/null; then
          sudo darwin-rebuild switch --flake .#{{.HOSTNAME}} --impure --show-trace --max-jobs 4 {{.SOFKA_CACHE}} {{.ML_OVERRIDE}}
        else
          sudo nix run nix-darwin -- switch --flake .#{{.HOSTNAME}} --impure --show-trace --max-jobs 4 {{.SOFKA_CACHE}} {{.ML_OVERRIDE}}
        fi

  update:
    cmds:
      - nix flake update
    desc: Update the flake.lock file and all pinned app versions

  # Single combined call: updates mailerlite (and its own nested inputs, e.g.
  # claude-code-overlay) and sofka in one lock-file pass instead of 3 separate
  # `nix flake update` invocations racing on the same flake.lock/git input.
  update-pinned:
    silent: true
    internal: true
    cmds:
      - |
        if [ -d "{{.ML_PATH}}" ]; then
          nix flake update mailerlite sofka
        else
          echo "mailerlite path not present on this machine, skipping mailerlite update"
          nix flake update sofka
        fi
    desc: Update the mailerlite and sofka inputs in the flake.lock file

  update-hash:
    internal: true
    cmds:
      - ml-update-hash 2>/dev/null || true
    desc: Update the stored hash after successful build

  build:
    cmds:
      - task: update-pinned
      - task: switch-config
      - task: update-hash
    desc: Build and apply the new configuration based on the OS

  update-build:
    deps: [update, build]
    desc: Update the flake.lock file and build the new configuration
