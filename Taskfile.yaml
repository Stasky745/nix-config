version: "3"

vars:
  USERNAME:
    sh: whoami
  HOME_DIR: /Users/{{.USERNAME}}
  HOSTNAME:
    sh: "(scutil --get ComputerName 2>/dev/null || uname -n) | tr -cd 'A-Za-z0-9-' | tr ' ' '-'"
  ML_PATH: /Users/{{.USERNAME}}/.config/mailerlite/nix-config
  ML_OVERRIDE:
    sh: "[ -d '{{.ML_PATH}}' ] || echo '--override-input mailerlite path:./stubs/mailerlite'"

tasks:
  default:
    cmds:
      - task --list

  gc:
    cmds:
      - nix-collect-garbage
    desc: Tidy up the nix store

  build-check:
    silent: true
    cmds:
      - nix build .#darwinConfigurations.{{.HOSTNAME}}.system --impure --show-trace --max-jobs 4 {{.ML_OVERRIDE}}
    desc: "Build (but don't switch) the configuration, to sanity-check it before applying"

  switch-config:
    internal: true
    silent: true
    cmds:
      - |
        if command -v darwin-rebuild &> /dev/null; then
          sudo darwin-rebuild switch --flake .#{{.HOSTNAME}} --impure --show-trace --max-jobs 4 {{.ML_OVERRIDE}}
        else
          sudo nix run nix-darwin -- switch --flake .#{{.HOSTNAME}} --impure --show-trace --max-jobs 4 {{.ML_OVERRIDE}}
        fi

  update:
    cmds:
      - nix flake update
    desc: Update the flake.lock file and all pinned app versions

  update-mailerlite:
    silent: true
    internal: true
    cmds:
      - |
        if [ -d "{{.ML_PATH}}" ]; then
          nix flake update mailerlite
        else
          echo "mailerlite path not present on this machine, skipping"
        fi
    desc: Update the mailerlite input in the flake.lock file

  update-claude-code:
    silent: true
    internal: true
    cmds:
      - nix flake update claude-code-overlay
    desc: Update the claude-code-overlay input in the flake.lock file

  update-sofka:
    silent: true
    internal: true
    cmds:
      - nix flake update sofka
    desc: Update the sofka input in the flake.lock file

  update-hash:
    internal: true
    cmds:
      - ml-update-hash 2>/dev/null || true
    desc: Update the stored hash after successful build

  build:
    deps: [update-mailerlite, update-claude-code, update-sofka]
    cmds:
      - task: switch-config
      - task: update-hash
    desc: Build and apply the new configuration based on the OS

  update-build:
    deps: [update, build]
    desc: Update the flake.lock file and build the new configuration
